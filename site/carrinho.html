<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>Carrinho</title>
</head>
<body>
    <header>
        <nav id="navbar-custom" class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#">
                    <img src="logo.png" height="100" alt="">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item active">
                            <a class="nav-link" href="carrinho.html">CARRINHO</a>
                        </li>
                        <li class="nav-item" id="nav-login">
                            <a class="nav-link" href="login.html">LOGIN</a>
                        </li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Opções
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex flex-column align-items-center" style="justify-content: flex-start; min-height: 100vh; padding-top: 20px; width: 100%;">
        <h1 style="margin-bottom: 20px;">🛒 Meu Carrinho</h1>
        <div id="itens-carrinho" style="width: 100%; max-width: 900px;"></div>
        <div id="resumo-carrinho" style="width: 100%; max-width: 900px; margin-top: 20px;"></div>
    </main>

    <!-- ALERTA TOAST -->
    <div class="position-fixed" style="top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1050;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">Mensagem</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
            </div>
        </div>
    </div>
    <!-- FIM ALERTA TOAST -->

    <footer></footer>

    <!-- ORDEM IMPORTA -->
    <script src="./pages.js"></script>
    <script src="./carrinho.js"></script>
    <script>
        function renderizar_carrinho() {
            const carrinho = obter_carrinho();
            const container = document.getElementById("itens-carrinho");
            const resumo = document.getElementById("resumo-carrinho");
            container.replaceChildren();
            resumo.replaceChildren();

            if (carrinho.length === 0) {
                container.innerHTML = '<p style="text-align:center;">🛒 Seu carrinho está vazio.</p>';
                return;
            }

            carrinho.forEach(item => {
                const card = document.createElement("div");
                card.className = "card item-carrinho";
                card.style.flexDirection = "row";
                card.style.alignItems = "center";
                card.style.marginBottom = "15px";
                card.style.cursor = "default";
                card.innerHTML = `
                    <img src="${item.caminho_img}" alt="${item.nome}" style="width:100px;height:100px;object-fit:contain;background:var(--cor-cinza-claro);border-radius:12px;margin-right:15px;">
                    <div style="flex:1;">
                        <div class="nome-produto">${item.nome}</div>
                        <div style="color:#5b5b6b;">Preço unitário: R$ ${item.preco.replace(".", ",")}</div>
                        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
                            <button class="btn_enviar" style="width:auto;padding:6px 14px;" onclick="diminuir('${item.id}')">−</button>
                            <span style="font-weight:bold;">${item.quantidade}</span>
                            <button class="btn_enviar" style="width:auto;padding:6px 14px;" onclick="aumentar('${item.id}')">+</button>
                            <button class="btn_enviar" style="width:auto;padding:6px 14px;background-color:#a00;" onclick="excluir('${item.id}')">Remover</button>
                        </div>
                    </div>
                    <div class="preco" style="margin-left:15px;">
                        R$ ${(parseFloat(item.preco) * item.quantidade).toFixed(2).replace(".", ",")}
                    </div>
                `;
                container.appendChild(card);
            });

            const total = calcular_total_carrinho();
            resumo.innerHTML = `
                <div class="card" style="cursor:default;">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                        <h3 style="margin:0;color:var(--cor-vermelho-escuro);">Total: R$ ${total.toFixed(2).replace(".", ",")}</h3>
                        <button class="btn_enviar" style="width:auto;padding:14px 30px;" onclick="finalizar_compra()">Finalizar Compra</button>
                    </div>
                </div>
            `;
        }

        function aumentar(id) {
            const carrinho = obter_carrinho();
            const item = carrinho.find(i => String(i.id) === String(id));
            if (item) {
                alterar_quantidade(id, item.quantidade + 1);
                renderizar_carrinho();
            }
        }

        function diminuir(id) {
            const carrinho = obter_carrinho();
            const item = carrinho.find(i => String(i.id) === String(id));
            if (item) {
                alterar_quantidade(id, item.quantidade - 1);
                renderizar_carrinho();
            }
        }

        function excluir(id) {
            remover_do_carrinho(id);
            renderizar_carrinho();
            mostrarToast("🗑️ Item removido do carrinho", "bg-success");
        }

        async function finalizar_compra() {
            const token = localStorage.getItem("token");
            if (!token) {
                mostrarToast("❌ Você precisa estar logado para finalizar a compra!", "bg-danger");
                setTimeout(() => { window.location.href = "login.html"; }, 2000);
                return;
            }

            const carrinho = obter_carrinho();
            if (carrinho.length === 0) {
                mostrarToast("❌ Seu carrinho está vazio!", "bg-danger");
                return;
            }

            const corpo = {
                itens: carrinho.map(item => ({
                    id_produto: item.id,
                    quantidade: item.quantidade
                }))
            };

            try {
                const resposta = await fetch("http://localhost:3000/compra", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(corpo)
                });

                const json = await resposta.json();
                if (!resposta.ok) {
                    throw new Error(json.msg || "Erro ao finalizar compra");
                }

                mostrarToast("✅ Compra realizada com sucesso!", "bg-success");
                limpar_carrinho();
                setTimeout(() => { window.location.href = "index.html"; }, 2000);
            } catch (error) {
                console.error(error);
                mostrarToast("❌ " + error.message, "bg-danger");
            }
        }

        window.addEventListener("DOMContentLoaded", renderizar_carrinho);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
